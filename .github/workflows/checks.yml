name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Docker image runs; 3.14 is the laptop's, from .python-version.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # No extras: the image installs none, and the tests do not need torch or surya.
      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # ruff is pinned in the dev group, so a new release cannot fail a commit that did not
      # change; Dependabot bumps it in a PR of its own.
      - name: Install ruff
        run: uv sync --locked --only-group dev --no-install-project

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check the shell scripts parse
        run: bash -n deploy.sh run.sh sync.sh

      - name: Check the extension scripts parse
        run: |
          for script in extension/background.js extension/content/content.js extension/options/options.js; do
            node --check "$script"
          done
