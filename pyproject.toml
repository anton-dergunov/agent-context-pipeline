[project]
name = "instagram-extractor"
version = "0.1.0"
description = "Download Instagram posts and prepare their text and media for downstream LLM processing."
readme = "README.instagram.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "browser-cookie3>=0.20.1",
    "instaloader>=4.14.2",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pillow>=10.2,<11",
    "pyobjc-framework-quartz>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=11.0; sys_platform == 'darwin'",
    "rapidfuzz>=3.10",
    # 0.17.x is the last classical detector/recognizer. Newer Surya 2 releases
    # are generative VLMs, which are too heavy and less deterministic per frame.
    "surya-ocr==0.17.0",
    "transformers>=4.56.1,<5",
]

[project.scripts]
instagram-extract = "instagram_extractor.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["instagram_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
