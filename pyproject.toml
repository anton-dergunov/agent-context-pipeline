[project]
name = "info-triage"
version = "0.1.0"
description = "Self-hosted capture, content extraction and an agent-ready inbox"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "av>=12,<17",
    "beautifulsoup4>=4.12,<5",
    "browser-cookie3>=0.20.1",
    "curl-cffi>=0.13,<1",
    "emoji>=2.14,<3",
    "faster-whisper>=1.2.1,<2",
    "huggingface-hub>=0.27,<2",
    "instaloader>=4.14.2",
    "numpy>=2.1",
    "onnxruntime>=1.28.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.2,<11",
    "pdfplumber>=0.11.9,<0.12",
    "pypdf>=6.14,<7",
    "python-telegram-bot==21.7",
    "pyyaml>=6,<7",
    "pyobjc-framework-quartz>=11.0; sys_platform == 'darwin' and python_version < '3.14'",
    "pyobjc-framework-vision>=11.0; sys_platform == 'darwin' and python_version < '3.14'",
    "rapidfuzz>=3.10",
    "rapidocr>=3.9.2",
    "requests>=2.32,<3",
    "trafilatura>=2.1,<3",
    "urllib3>=2.2,<3",
    "yt-dlp[default,curl-cffi]==2026.8.4.234419.dev0",
]

[project.optional-dependencies]
# The more accurate still-image engine remains available for workstation use,
# but is intentionally excluded from the portable Linux production image.
surya = [
    "surya-ocr==0.17.0",
    "transformers>=4.56.1,<5",
]
# The cross-encoder that ranks an item's possible neighbours runs on the laptop, in
# sync.py, and has no business on the server: the Docker image installs no extras. Without
# it the sync still delivers every item and prints one line saying the section is off.
neighbours = [
    "sentence-transformers>=5,<6",
    "torch>=2.4",
]
# MLX executes Whisper on the Apple Silicon GPU and cannot run in the Linux container.
mac-transcription = [
    "mlx-whisper>=0.4.3,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
info-triage-capture = "info_triage.capture_cli:main"
info-triage-clean-text = "info_triage.utilities.text_cleaning:main"
info-triage-resolve-urls = "info_triage.utilities.url_resolution:main"
instagram-extract = "info_triage.extractors.instagram.cli:main"
linkedin-extract = "info_triage.extractors.linkedin.cli:main"
medium-extract = "info_triage.extractors.medium.cli:main"
medium-html-to-markdown = "info_triage.extractors.medium.postprocess:main"
research-extract = "info_triage.extractors.research.cli:main"
url-extract = "info_triage.extractors.routing_cli:main"
youtube-extract = "info_triage.extractors.youtube.cli:main"

[dependency-groups]
# jieba segments Mandarin for the transcription benchmark in experiments/; nothing
# the application runs needs it, so it stays out of the Docker image.
dev = ["pytest>=8.3", "jieba>=0.42.1,<1"]

[tool.uv]
# rapidocr declares the GUI OpenCV distribution even though this application
# deliberately uses the headless build. Avoid installing both distributions,
# which provide the same cv2 module.
override-dependencies = ["opencv-python; python_version < '3.0'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/info_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
