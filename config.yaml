# Info Triage daemon configuration.
# Secrets and the authorized Telegram user remain in .env.

storage:
  # Relative paths are resolved from this configuration file's directory.
  data_dir: data

web:
  # Internal HTTP port used by the dashboard and GET /health.
  port: 8000

telegram:
  grouping:
    # Consecutive Telegram messages at or below this timestamp gap form one item.
    max_gap_seconds: 3.0
    # Wait this long after the latest message before finalizing the group.
    # It must be greater than max_gap_seconds to avoid boundary races.
    settle_seconds: 4.0

extractors:
  youtube:
    # Total full-command attempts: the initial attempt plus two retries.
    max_attempts: 3
    # Exponential retry waits start here: 5 seconds, then 10 seconds.
    retry_backoff_seconds: 5
    # Preserve YouTube's top ranking and include a small bounded conversation.
    max_parent_comments: 5
    max_replies: 10
    max_replies_per_thread: 2
    # yt-dlp recommends nightly for regular use because site changes are frequent.
    update_channel: nightly
    # At most one proactive release check per day; compatibility failures bypass it.
    update_check_interval_hours: 24
    update_on_compatibility_error: true

  instagram:
    # Instaloader updates remain lockfile-reviewed; only transient extraction retries run here.
    max_attempts: 3
    retry_backoff_seconds: 5

processing:
  # Steps execute in this exact order. Remove a step to disable it.
  steps:
    - name: voice-transcription
      # The portable NAS backend. Changing the container model requires a rebuild.
      backend: faster-whisper
      # Multilingual Whisper model size preloaded into the Docker image.
      model: small
      # Local model storage; runtime network downloads are disabled in Docker.
      model_cache_dir: .whisper_models
      # CPU inference threads used by the voice processor.
      threads: 1

    # Cleaning runs before the URL work: zero-width characters and homoglyphs can
    # glue themselves to a URL and defeat link discovery.
    - name: text-cleaning

    # Discovery collects hidden hyperlink destinations and the visible links into
    # one canonical table. It never uses the network; resolution finishes the job.
    - name: link-discovery

    - name: url-resolution
      # Redirect-only compatibility calls resolve just recognized shorteners by default.
      # Per-request read timeout after connecting.
      timeout_seconds: 30.0
      # Retry transient connection, throttling, and server failures this many times.
      retries: 4
      # Inspect at most 20 MiB of HTML for redirects and title metadata.
      max_html_bytes: 20971520
      # Download at most 20 MiB for PDF metadata and first-page title text.
      max_pdf_bytes: 20971520
      resolve_all: false
      # Resolve at most this many link titles per item, highest priority first.
      # A link list of 43 entries is worth reading as titles, not as bodies.
      resolve_budget: 40

    # The last step: everything the item knows about itself, in one file.
    - name: index-render
      # At or above this many distinct links the item is a link list, which is
      # read as a titled table rather than as content.
      linklist_threshold: 8
