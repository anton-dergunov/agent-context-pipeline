services:
  info-triage:
    build:
      context: .
      args:
        APP_UID: ${INFO_TRIAGE_UID:-1000}
        APP_GID: ${INFO_TRIAGE_GID:-1000}
    container_name: info-triage
    restart: unless-stopped
    # The user that owns ./data on the host, so that what the container writes
    # there can be read, and removed, from outside it. Set both in .env.
    user: "${INFO_TRIAGE_UID:-1000}:${INFO_TRIAGE_GID:-1000}"

    # CPU-heavy OCR/transcription libraries are pinned to one thread. Shares
    # lower their relative CPU priority without requiring a CFS quota.
    mem_limit: 8g
    memswap_limit: 8g
    cpu_shares: 512

    env_file:
      - .env

    environment:
      TZ: ${TZ:-UTC}

    volumes:
      - ./data:/app/data

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
