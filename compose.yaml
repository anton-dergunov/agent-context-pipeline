services:
  info-triage:
    build: .
    container_name: info-triage
    restart: unless-stopped
    user: "1026:100"

    # CPU-heavy OCR/transcription libraries are pinned to one thread. Shares
    # lower their relative CPU priority without requiring a CFS quota.
    mem_limit: 8g
    memswap_limit: 8g
    cpu_shares: 512

    env_file:
      - .env

    environment:
      INSTAGRAM_OCR_THREADS: "1"
      TZ: Europe/London

    volumes:
      - ./data:/app/data

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
