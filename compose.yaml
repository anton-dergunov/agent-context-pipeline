services:
  info-triage:
    build: .
    container_name: info-triage
    restart: unless-stopped
    user: "1026:100"

    env_file:
      - .env

    environment:
      DATA_DIR: /app/data
      PORT: "8000"

    volumes:
      - ./data:/app/data

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
